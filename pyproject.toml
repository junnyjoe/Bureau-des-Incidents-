[project]
name = "incident-desk"
version = "0.1.0"
description = "A Django incident-management starter for an application-security course"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django==5.2.18",
    "asgiref==3.13.0",
    "dj-database-url==3.1.2",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "python-dotenv==1.2.4",
    "sqlparse==0.6.0",
    "typing-extensions==4.16.0; python_version < '3.13'",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
